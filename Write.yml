---

- name: creazione file di testo
  hosts: localhost
  connection: local

  tasks:

    - name: crea cartella
      ansible.builtin.file:
        path: /tmp/playbook
        state: directory
        mode: "700"

    - name: crea file
      ansible.builtin.copy: 
        content: "buon appetito, da fabio tozzi"
        dest: /tmp/playbook/file.txt

    - name: salva contenuto del file 
      ansible.builtin.command: 
        cmd: cat  /tmp/playbook/file.txt
      register: messaggio

    - name: stampa messaggio
      ansible.builtin.debug:
        msg: "{{ messaggio.stdout_lines }}"




